<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="1220" viewBox="0 0 1672 1220" role="img" aria-labelledby="figtitle figdesc">
<title id="figtitle">Figure 6.2: Open backward-time travel versus a closed timelike curve</title>
<desc id="figdesc">Scientific two-panel conceptual comparison. Panel A shows a spacetime coordinate sketch with B chronologically before A: the traveler follows a locally future-directed route into a nontrivial spacetime shortcut from A to B and continues on an open worldline. A dashed path B to A is timelike and geometrically permitted but is not taken by the traveler. The geometry therefore permits a closed timelike path. Panel B displays a closed timelike curve with proper time increasing locally and a single event E marked as both start and end, a global causal schematic rather than one Minkowski-coordinate diagram. Neither case demonstrates that a physically realizable time machine exists.</desc>
<defs>
<marker id="navy-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#10213D"/></marker>
<marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1C65BD"/></marker>
<marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#00877D"/></marker>
<marker id="violet-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6D46B5"/></marker>
<marker id="grey-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8A9AAF"/></marker>
</defs>
<rect x="0" y="0" width="1672" height="1220" rx="0" fill="#fff" stroke="#fff" stroke-width="0" opacity="1"/>
<text x="48" y="57" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#10213D" text-anchor="start" font-weight="bold">Open backward-time travel versus a closed timelike curve</text>
<text x="50" y="95" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#536680" text-anchor="start">Actual traveler worldlines and geometrically permitted causal paths are not the same thing</text>
<rect x="48" y="130" width="773" height="740" rx="14" fill="#fff" stroke="#C5D0DE" stroke-width="1.6" opacity="1"/>
<rect x="49" y="131" width="771" height="63" rx="13" fill="#EAF1F9" stroke="#EAF1F9" stroke-width="0" opacity="1"/>
<rect x="49" y="178" width="771" height="15" rx="0" fill="#EAF1F9" stroke="#EAF1F9" stroke-width="0" opacity="1"/>
<rect x="845" y="130" width="779" height="740" rx="14" fill="#fff" stroke="#C5D0DE" stroke-width="1.6" opacity="1"/>
<rect x="846" y="131" width="777" height="63" rx="13" fill="#EAF1F9" stroke="#EAF1F9" stroke-width="0" opacity="1"/>
<rect x="846" y="178" width="777" height="15" rx="0" fill="#EAF1F9" stroke="#EAF1F9" stroke-width="0" opacity="1"/>
<text x="76" y="169" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#10213D" text-anchor="start" font-weight="bold">A. Open traveler worldline</text>
<text x="870" y="169" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#10213D" text-anchor="start" font-weight="bold">B. Closed traveler worldline (CTC)</text>
<line x1="162" y1="785" x2="162" y2="239" stroke="#10213D" stroke-width="3" fill="none" opacity="1" stroke-linecap="round" marker-end="url(#navy-arrow)"/>
<line x1="149" y1="775" x2="786" y2="775" stroke="#10213D" stroke-width="3" fill="none" opacity="1" stroke-linecap="round" marker-end="url(#navy-arrow)"/>
<text x="133" y="243" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#10213D" text-anchor="start" font-style="italic">ct</text>
<text x="795" y="793" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#10213D" text-anchor="start" font-style="italic">x</text>
<line x1="342" y1="620" x2="169" y2="447" stroke="#B2C0D2" stroke-width="1.8" fill="none" opacity="0.8" stroke-linecap="round" stroke-dasharray="4 6"/>
<line x1="342" y1="620" x2="675" y2="287" stroke="#B2C0D2" stroke-width="1.8" fill="none" opacity="0.8" stroke-linecap="round" stroke-dasharray="4 6"/>
<path d="M 532 587 C 531 520 533 428 532 327" fill="none" stroke="#1C65BD" stroke-width="6" opacity="1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="532" y1="418" x2="532" y2="377" stroke="#1C65BD" stroke-width="4.8" fill="none" opacity="1" stroke-linecap="round" marker-end="url(#blue-arrow)"/>
<text x="550" y="501" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1C65BD" text-anchor="start">traveler before A</text>
<path d="M 342 620 C 336 550 319 442 298 330" fill="none" stroke="#1C65BD" stroke-width="6" opacity="1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="314" y1="427" x2="305" y2="379" stroke="#1C65BD" stroke-width="4.8" fill="none" opacity="1" stroke-linecap="round" marker-end="url(#blue-arrow)"/>
<text x="197" y="376" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1C65BD" text-anchor="start" transform="rotate(-79 197 376)">traveler after B</text>
<path d="M 550 326 C 690 282 747 418 706 530 C 668 654 479 684 359 628" fill="none" stroke="#6D46B5" stroke-width="5.3" opacity="1" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="12 9" marker-end="url(#violet-arrow)"/>
<path d="M 342 620 Q 450 502 532 327" fill="none" stroke="#8A9AAF" stroke-width="3" opacity="0.95" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 8" marker-end="url(#grey-arrow)"/>
<rect x="560" y="378" width="216" height="69" rx="9" fill="#F7F3FC" stroke="#D7C8EC" stroke-width="1.1" opacity="1"/>
<text x="576" y="402" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#6D46B5" text-anchor="start" font-weight="bold">A→B: taken</text>
<text x="576" y="429" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#536680" text-anchor="start">global shortcut*</text>
<rect x="377" y="515" width="230" height="60" rx="9" fill="#FFFFFF" stroke="#D5DDE9" stroke-width="1.0" opacity="1"/>
<text x="390" y="540" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#536680" text-anchor="start" font-weight="bold">B→A: permitted</text>
<text x="390" y="563" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#536680" text-anchor="start">but not traveled</text>
<circle cx="532" cy="327" r="10" fill="#C7781C" stroke="#fff" stroke-width="2"/>
<circle cx="342" cy="620" r="10" fill="#00877D" stroke="#fff" stroke-width="2"/>
<text x="520" y="303" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#10213D" text-anchor="middle" font-weight="bold">A</text>
<text x="318" y="623" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#10213D" text-anchor="end" font-weight="bold">B</text>
<text x="369" y="674" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#10213D" text-anchor="start">B lies in the chronological past of A</text>
<rect x="72" y="708" width="710" height="48" rx="8" fill="#F4F7FB" stroke="#E1E8F0" stroke-width="1" opacity="1"/>
<text x="87" y="728" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#536680" text-anchor="start">* Time-shifted connection is schematic; it is not a flat-spacetime path.</text>
<text x="87" y="747" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#536680" text-anchor="start">The actual traveler does not traverse the dashed grey return route.</text>
<text x="1235" y="235" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#10213D" text-anchor="middle">Locally future-directed at every point</text>
<ellipse cx="1248" cy="493" rx="244" ry="192" fill="#F7F3FC" stroke="#E7DDF4" stroke-width="1.6"/>
<path d="M 1248 301 C 1384 301 1492 389 1492 493 C 1492 601 1384 685 1248 685 C 1113 685 1004 600 1004 493 C 1004 390 1112 301 1248 301 Z" fill="none" stroke="#1C65BD" stroke-width="6.2" opacity="1" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 1340 317 C 1387 337 1419 364 1442 401" fill="none" stroke="#1C65BD" stroke-width="4.2" opacity="1" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/>
<path d="M 1490 470 C 1496 518 1479 566 1441 603" fill="none" stroke="#1C65BD" stroke-width="4.2" opacity="1" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/>
<path d="M 1383 651 C 1332 681 1279 686 1218 683" fill="none" stroke="#1C65BD" stroke-width="4.2" opacity="1" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/>
<path d="M 1086 644 C 1041 604 1012 562 1005 509" fill="none" stroke="#1C65BD" stroke-width="4.2" opacity="1" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/>
<path d="M 1024 413 C 1058 350 1115 320 1193 302" fill="none" stroke="#1C65BD" stroke-width="4.2" opacity="1" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#blue-arrow)"/>
<circle cx="1248" cy="301" r="13" fill="#C7781C" stroke="#fff" stroke-width="2"/>
<text x="1270" y="288" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#10213D" text-anchor="start" font-weight="bold">E: same spacetime event</text>
<rect x="1093" y="449" width="310" height="99" rx="13" fill="#FFFFFF" stroke="#D6C5EB" stroke-width="1.5" opacity="1"/>
<text x="1248" y="485" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" fill="#6D46B5" text-anchor="middle" font-weight="bold">γ(τ + T) = γ(τ)</text>
<text x="1248" y="520" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#536680" text-anchor="middle">T &gt; 0; local proper time increases</text>
<rect x="890" y="719" width="680" height="85" rx="9" fill="#F4F7FB" stroke="#E1E8F0" stroke-width="1" opacity="1"/>
<text x="908" y="750" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#10213D" text-anchor="start" font-weight="bold">Closed curve: the actual path returns to E.</text>
<text x="908" y="776" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#536680" text-anchor="start">A physical traveler would also require consistent states at E.</text>
<text x="1248" y="831" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#536680" text-anchor="middle" font-style="italic">Global causal schematic — not one Minkowski coordinate chart</text>
<rect x="48" y="891" width="1576" height="82" rx="10" fill="#F4F7FB" stroke="#DFE7F0" stroke-width="1" opacity="1"/>
<text x="72" y="925" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#10213D" text-anchor="start" font-weight="bold">Key distinction:</text>
<text x="256" y="925" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#10213D" text-anchor="start">A spacetime can admit a CTC even when the actual time traveler follows an open worldline.</text>
<line x1="76" y1="949" x2="135" y2="949" stroke="#1C65BD" stroke-width="5.0" fill="none" opacity="1" stroke-linecap="round"/>
<text x="149" y="955" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#536680" text-anchor="start">actual traveler</text>
<line x1="445" y1="949" x2="507" y2="949" stroke="#6D46B5" stroke-width="4.5" fill="none" opacity="1" stroke-linecap="round" stroke-dasharray="10 7"/>
<text x="518" y="955" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#536680" text-anchor="start">time-shifted connection (taken)</text>
<line x1="996" y1="949" x2="1056" y2="949" stroke="#8A9AAF" stroke-width="3" fill="none" opacity="1" stroke-linecap="round" stroke-dasharray="8 7"/>
<text x="1067" y="955" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#536680" text-anchor="start">permitted route (not taken)</text>
<line x1="51" y1="996" x2="1621" y2="996" stroke="#DDE6F0" stroke-width="1.4" fill="none" opacity="1" stroke-linecap="round"/>
<text x="51" y="1035" font-family="Liberation Serif, Georgia, serif" font-size="25" fill="#10213D" text-anchor="start" font-weight="bold">Figure 6.2.</text>
<text x="199" y="1035" font-family="Liberation Serif, Georgia, serif" font-size="25" fill="#10213D" text-anchor="start" font-style="italic">Open backward-time travel versus a closed timelike curve.</text>
<text x="51" y="1077" font-family="Liberation Serif, Georgia, serif" font-size="24" fill="#10213D" text-anchor="start">(A) A future-directed journey from departure A to earlier B through nontrivial global geometry is part of an open traveler worldline. A</text>
<text x="51" y="1112" font-family="Liberation Serif, Georgia, serif" font-size="24" fill="#10213D" text-anchor="start">separate geometrically permitted B→A return route is not taken, even though together the paths establish the existence of a closed timelike</text>
<text x="51" y="1147" font-family="Liberation Serif, Georgia, serif" font-size="24" fill="#10213D" text-anchor="start">path. (B) A closed traveler worldline returns to the same event while proper time increases locally around the loop. Such a realized trajectory</text>
<text x="51" y="1182" font-family="Liberation Serif, Georgia, serif" font-size="24" fill="#10213D" text-anchor="start">additionally requires a self-consistent physical state; these are schematic causal structures, not evidence of a working time machine.</text>
</svg>
