4,439.86529147324205 555.8402366863905,436.1424339080592 559.1834319526627,432.13376915023554 562.5266272189349,427.90644033285696 565.8698224852071,423.53727387682676 569.2130177514794,419.10965100913154 572.5562130177515,414.7101041536437 575.8994082840236,410.42477979473273 579.2426035502958,406.3359149846249 582.5857988165681,402.51847410452626 585.9289940828403,399.0370858203619 589.2721893491124,395.94340767443896 592.6153846153846,393.2740279452187 595.9585798816568,391.0489920307082 599.301775147929,389.27101459911347 602.6449704142012,387.925410187144 605.9881656804735,386.980745001857 609.3313609467455,386.390182643014 612.6745562130177,386.0934675612172 616.0177514792899,386.01946350680515 619.3609467455622,386.0891411123002 622.7041420118344,386.2188900500823 626.0473372781065,386.32401769612073 629.3905325443787,386.32228847293175 632.7337278106509,386.1373563636686 636.0769230769231,385.70194755437535 639.4201183431953,384.96066058687984 642.7633136094676,383.8722673561009 646.1065088757396,382.4114190980075 649.4497041420118,380.56968632085943 652.792899408284,378.3558893989933 656.1360946745563,375.79570611830627 659.4792899408284,372.93057260357085 662.8224852071006,369.81592351385274 666.1656804733727,366.5188449361909 669.508875739645,363.11523789161294 672.8520710059172,359.6866107712702 676.1952662721893,356.31663449377913 679.5384615384615,353.08760407298047 682.8816568047337,350.0769541958003 686.2248520710059,347.353974169754 689.5680473372781,344.9768593021817 692.9112426035502,342.9902217642371 696.2544378698225,341.4231648556826 699.5976331360947,340.28800111902086 702.9408284023668,339.57966793122955 706.2840236686391,339.27586514588114 709.6272189349112,339.3379092783617 712.9704142011834,339.7122688756034 716.3136094674556,340.33271733302854 719.6568047337278,341.12301369771683 723.0,341.99999999999994" stroke="#1C65BD" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" /><circle cx="158" cy="650" fill="#1C65BD" r="6" stroke="#fff" stroke-width="2" /><circle cx="723" cy="341.99999999999994" fill="#1C65BD" r="6" stroke="#fff" stroke-width="2" /><rect fill="#F4F7FB" height="55" rx="8" stroke="#DFE7F0" stroke-width="1" width="192" x="155" y="555" /><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="18" font-style="normal" font-weight="bold" text-anchor="start" x="169" y="577">Low-entropy</text><text fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="17" font-style="normal" font-weight="normal" text-anchor="start" x="169" y="600">early condition</text><rect fill="#F4F7FB" height="57" rx="8" stroke="#DFE7F0" stroke-width="1" width="215" x="525" y="298" /><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="18" font-style="normal" font-weight="bold" text-anchor="start" x="538" y="321">Greater entropy</text><text fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="17" font-style="normal" font-weight="normal" text-anchor="start" x="538" y="344">in later regions</text><text fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="17" font-style="italic" font-weight="normal" text-anchor="start" x="155" y="797">Illustrative entropy profile, not a measured curve</text><rect fill="#F6F9FD" height="130" rx="12" stroke="#B9CBE1" stroke-width="1.6" width="214" x="870" y="242" /><rect fill="#F6F9FD" height="130" rx="12" stroke="#B9CBE1" stroke-width="1.6" width="214" x="1126" y="242" /><rect fill="#F6F9FD" height="130" rx="12" stroke="#B9CBE1" stroke-width="1.6" width="216" x="1382" y="242" /><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="20" font-style="normal" font-weight="bold" text-anchor="middle" x="977" y="271">Interaction</text><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="20" font-style="normal" font-weight="bold" text-anchor="middle" x="1233" y="271">Record formed</text><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="20" font-style="normal" font-weight="bold" text-anchor="middle" x="1490" y="271">Environment</text><circle cx="947" cy="318" fill="#D97818" r="12" stroke="#fff" stroke-width="2" /><circle cx="1007" cy="318" fill="#1C65BD" r="12" stroke="#fff" stroke-width="2" /><line stroke="#D97818" stroke-dasharray="5 6" stroke-linecap="round" stroke-width="3" x1="963" x2="991" y1="317" y2="317" /><rect fill="#EAF7F4" height="49" rx="7" stroke="#A7CFC7" stroke-width="1" width="90" x="1188" y="296" /><text fill="#00877D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-style="normal" font-weight="bold" text-anchor="middle" x="1233" y="328">1</text><path d="M1459 347 C1447 334 1473 324 1459 307 C1447 293 1473 289 1459 279" fill="none" stroke="#D97818" stroke-linecap="round" stroke-width="3" /><path d="M1489 347 C1477 334 1503 324 1489 307 C1477 293 1503 289 1489 279" fill="none" stroke="#D97818" stroke-linecap="round" stroke-width="3" /><path d="M1519 347 C1507 334 1533 324 1519 307 C1507 293 1533 289 1519 279" fill="none" stroke="#D97818" stroke-linecap="round" stroke-width="3" /><line stroke="#00877D" stroke-linecap="round" stroke-width="3" x1="1087" x2="1117" y1="309" y2="309" /><polygon fill="#00877D" points="1118,309 1106,302 1106,316" /><line stroke="#D97818" stroke-linecap="round" stroke-width="3" x1="1344" x2="1373" y1="309" y2="309" /><polygon fill="#D97818" points="1373,309 1361,302 1361,316" /><text fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="19" font-style="normal" font-weight="normal" text-anchor="middle" x="981" y="398">Earlier event</text><text fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="19" font-style="normal" font-weight="normal" text-anchor="middle" x="1235" y="398">Later stored trace</text><text fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="19" font-style="normal" font-weight="normal" text-anchor="middle" x="1490" y="398">Heat / entropy export</text><rect fill="#F2FAF8" height="130" rx="12" stroke="#A7CFC7" stroke-width="1.4" width="733" x="878" y="435" /><text fill="#00877D" font-family="Arial, Helvetica, sans-serif" font-size="22" font-style="normal" font-weight="bold" text-anchor="start" x="904" y="468">Record asymmetry</text><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="19" font-style="normal" font-weight="normal" text-anchor="start" x="904" y="502">A later physical state can contain a trace of an earlier interaction.</text><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="19" font-style="normal" font-weight="normal" text-anchor="start" x="904" y="534">The earlier state does not ordinarily contain records produced later.</text><rect fill="#F4F7FB" height="166" rx="12" stroke="#DFE7F0" stroke-width="1.4" width="733" x="878" y="586" /><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="22" font-style="normal" font-weight="bold" text-anchor="start" x="904" y="620">Important qualifications</text><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="18" font-style="normal" font-weight="normal" text-anchor="start" x="904" y="654">• Local entropy can decrease while the surrounding total increases.</text><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="18" font-style="normal" font-weight="normal" text-anchor="start" x="904" y="685">• Memory is not required to increase monotonically.</text><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="18" font-style="normal" font-weight="normal" text-anchor="start" x="904" y="716">• The low-entropy initial condition is assumed, not explained.</text><rect fill="#F4F7FB" height="80" rx="10" stroke="#DFE7F0" stroke-width="1.2" width="1582" x="45" y="852" /><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="22" font-style="normal" font-weight="bold" text-anchor="start" x="67" y="888">Key insight:</text><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="20" font-style="normal" font-weight="normal" text-anchor="start" x="208" y="888">The overall thermodynamic arrow and the asymmetric production of records are connected,</text><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="20" font-style="normal" font-weight="normal" text-anchor="start" x="208" y="916">but neither requires a moving present or a globally increasing memory store.</text><line stroke="#DDE6F0" stroke-linecap="round" stroke-width="1.4" x1="48" x2="1623" y1="952" y2="952" /><text fill="#10213D" font-family="Liberation Serif, Georgia, serif" font-size="25" font-style="normal" font-weight="bold" text-anchor="start" x="51" y="990">Figure 2.2.</text><text fill="#10213D" font-family="Liberation Serif, Georgia, serif" font-size="25" font-style="italic" font-weight="normal" text-anchor="start" x="200" y="990">Entropy and the formation of physical records.</text><text fill="#10213D" font-family="Liberation Serif, Georgia, serif" font-size="23" font-style="normal" font-weight="normal" text-anchor="start" x="51" y="1032">(A) An illustrative overall entropy gradient within one complete physical history; local fluctuations and exceptions are possible.</text><text fill="#10213D" font-family="Liberation Serif, Georgia, serif" font-size="23" font-style="normal" font-weight="normal" text-anchor="start" x="51" y="1066">(B) An interaction can create a stored physical trace while exporting entropy to the environment. Later states ordinarily contain</text><text fill="#10213D" font-family="Liberation Serif, Georgia, serif" font-size="23" font-style="normal" font-weight="normal" text-anchor="start" x="51" y="1100">records of earlier interactions; the Block Universe does not explain the low-entropy boundary condition itself.</text></svg>