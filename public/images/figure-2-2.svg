<svg baseProfile="full" height="1138" version="1.1" viewBox="0 0 1672 1138" width="1672" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">Figure 2.2 — Entropy and physical record formation</title><desc id="figure-description">Panel A depicts an illustrative overall entropy trend from an unusual low-entropy early condition, allowing local fluctuations. Panel B depicts an interaction creating a physical record and releasing entropy to the environment. Records ordinarily encode earlier, not future, interactions; the diagram does not claim monotonically increasing memory or explain the early low-entropy condition.</desc><defs /><rect fill="#fff" height="1138" width="1672" x="0" y="0" /><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="32" font-style="normal" font-weight="bold" text-anchor="start" x="48" y="56">Entropy and physical record formation</text><text fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="20" font-style="normal" font-weight="normal" text-anchor="start" x="49" y="92">A thermodynamic asymmetry supports irreversible records without requiring spacetime itself to flow</text><rect fill="#fff" height="707" rx="12" stroke="#C5D0DE" stroke-width="1.5" width="785" x="45" y="125" /><rect fill="#fff" height="707" rx="12" stroke="#C5D0DE" stroke-width="1.5" width="785" x="842" y="125" /><rect fill="#EAF1F9" height="65" rx="12" stroke="none" stroke-width="1.5" width="783" x="46" y="126" /><rect fill="#EAF1F9" height="65" rx="12" stroke="none" stroke-width="1.5" width="783" x="843" y="126" /><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="24" font-style="normal" font-weight="bold" text-anchor="start" x="73" y="168">A. Thermodynamic orientation of the history</text><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="24" font-style="normal" font-weight="bold" text-anchor="start" x="870" y="168">B. An interaction leaves a physical record</text><line stroke="#DFE7F0" stroke-dasharray="5 7" stroke-linecap="round" stroke-width="1.3" x1="121" x2="759" y1="628" y2="628" /><text fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="16" font-style="normal" font-weight="normal" text-anchor="end" x="116" y="633">lower</text><line stroke="#DFE7F0" stroke-dasharray="5 7" stroke-linecap="round" stroke-width="1.3" x1="121" x2="759" y1="456" y2="456" /><text fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="16" font-style="normal" font-weight="normal" text-anchor="end" x="116" y="461">intermediate</text><line stroke="#DFE7F0" stroke-dasharray="5 7" stroke-linecap="round" stroke-width="1.3" x1="121" x2="759" y1="284" y2="284" /><text fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="16" font-style="normal" font-weight="normal" text-anchor="end" x="116" y="289">higher</text><line stroke="#10213D" stroke-linecap="round" stroke-width="3" x1="121" x2="759" y1="714" y2="714" /><line stroke="#10213D" stroke-linecap="round" stroke-width="3" x1="121" x2="121" y1="714" y2="257" /><polygon fill="#10213D" points="759,714 744,706 744,722" /><polygon fill="#10213D" points="121,257 113,272 129,272" /><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="20" font-style="normal" font-weight="normal" text-anchor="middle" x="431" y="751">Position along the history  →</text><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="20" font-style="normal" font-weight="bold" text-anchor="start" x="69" y="254">Entropy</text><polyline fill="none" points="158.0,650.0 161.34319526627218,645.4780432835157 164.68639053254438,641.0427765046262 168.02958579881656,636.777357633 171.37278106508876,632.758027621557 174.71597633136093,629.0510130748753 178.05917159763314,625.7098454460225 181.40236686390534,622.7732082196126 184.74556213