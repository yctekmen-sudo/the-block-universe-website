<text x="599" y="226" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#445b77">Which distant events share t = 0?</text>
<rect x="1118" y="148" width="522" height="676" rx="15" fill="#fff" stroke="#b9a9df" stroke-width="2"/>
<rect x="1118" y="148" width="522" height="111" rx="15" fill="#f0edfa" stroke="none" stroke-width="1"/>
<rect x="1118" y="243" width="522" height="16" rx="0" fill="#f0edfa" stroke="none" stroke-width="1"/>
<text x="1142" y="191" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#132b4a" font-weight="bold">C. Ontological existence</text>
<text x="1142" y="226" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#445b77">Which spacetime events exist?</text>
