<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="1060" viewBox="0 0 1672 1060" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Three meanings of now: observation, simultaneity, and existence</title>
<desc id="fig-desc">Three panels distinguish signals arriving at an observer event on the past light cone, simultaneous events in a selected coordinate frame, and the philosophical question of the existence of events throughout the four-dimensional history. An explicit note distinguishes relativity from the further ontological interpretation.</desc>
