<text x="1379" y="674" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#7653b2" font-weight="bold" text-anchor="middle">events at different times</text>
<rect x="1138" y="715" width="482" height="91" rx="12" fill="#f8f5fd" stroke="none" stroke-width="1"/>
<text x="1158" y="749" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#18314f">Do past, present, and future events</text>
<text x="1158" y="777" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#18314f">all exist in the same ontological sense?</text>
<rect x="32" y="845" width="1608" height="95" rx="15" fill="#f7f9fc" stroke="#b0c1d6" stroke-width="1.5"/>
<text x="61" y="881" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#18314f" font-weight="bold">Crucial distinction:</text>
<text x="292" y="881" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#18314f">Observation and simultaneity are physical relations.</text>
<text x="61" y="913" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#18314f">The claim that all events exist together is an additional ontological premise, not a theorem of relativity.</text>
<text x="43" y="986" font-family="Georgia, serif" font-size="26" fill="#162a44" font-weight="bold">Figure 1.1.</text>
<text x="340" y="986" font-family="Georgia, serif" font-size="24" fill="#18314f">“Now” can refer to arriving information, coordinate simultaneity, or a claim about existence.</text>
<text x="43" y="1023" font-family="Georgia, serif" font-size="22" fill="#18314f">Past-cone boundary = signals received at O; simultaneity depends on reference frame; existence requires interpretation.</text>
</svg>