<?xml version="1.0" encoding="utf-8" ?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="1230" version="1.1" viewBox="0 0 1672 1230" width="1672">
  <title>Figure 1.1. Minkowski spacetime and the relativity of simultaneity</title>
  <desc>Reference frame A has orthogonal orange axes x and ct. Observer B has blue boosted axes meeting at 75 degrees, C has green boosted axes meeting at 60 degrees. All three frames share the marked origin. Event E lies on B present (blue x prime axis), a dashed orange future time slice of A, and a dashed green past time slice of C. Grey light cone lines form 45 degree angles from the origin. Observer D is at rest relative to A, with a purple vertical worldline passing through E; D locally observes E.</desc>
  <defs>
    <marker id="arrowOrangeA" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="9" refY="5">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#D97818"/>
    </marker>
    <marker id="arrowBlue" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="9" refY="5">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#1C65BD"/>
    </marker>
    <marker id="arrowGreen" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="9" refY="5">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#00877D"/>
    </marker>
    <marker id="arrowPurple" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="9" refY="5">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6D46B5"/>
    </marker>
  </defs>
  <rect fill="#FFFFFF" height="1230" width="1672" x="0" y="0"/>
  <text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="bold" x="48" y="57">Minkowski spacetime and the relativity of simultaneity</text>
  <text fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="20" x="50" y="91">One event E is present for B, future for A, past for C, and locally observed by D</text>
  <rect fill="#FFFFFF" height="817" rx="14" stroke="#C5D0DE" stroke-width="1.6" width="1576" x="48" y="122"/>
  <line fill="none" opacity="0.84" stroke="#93A3B8" stroke-dasharray="7 8" stroke-linecap="round" stroke-width="2.6" x1="170.0" x2="624.0" y1="675.0" y2="221.0"/>
  <line fill="none" opacity="0.84" stroke="#93A3B8" stroke-dasharray="7 8" stroke-linecap="round" stroke-width="2.6" x1="170.0" x2="69" y1="675.0" y2="574.0"/>
  <text fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="19" font-style="italic" transform="rotate(-45 536 275)" x="536" y="275">45° light cone</text>
  <line fill="none" opacity="1" stroke="#D97818" stroke-dasharray="13 9" stroke-linecap="round" stroke-width="3.7" x1="107" x2="1600" y1="520.0" y2="520.0"/>
  <text fill="#D97818" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" x="433" y="501.0">A's future time slice</text>
  <line fill="none" opacity="1" stroke="#00877D" stroke-dasharray="13 9" stroke-linecap="round" stroke-width="3.7" x1="94" x2="1605" y1="855.8319465883283" y2="450.96071682490185"/>
  <text fill="#00877D" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" transform="rotate(-15 724 666.0239553567209)" x="724" y="666.0239553567209">C's past time slice</text>
  <line fill="none" marker-end="url(#arrowOrangeA)" opacity="1" stroke="#D97818" stroke-linecap="round" stroke-width="4.3" x1="170.0" x2="170.0" y1="675.0" y2="191"/>
  <line fill="none" marker-end="url(#arrowOrangeA)" opacity="1" stroke="#D97818" stroke-linecap="round" stroke-width="4.3" x1="170.0" x2="1584" y1="675.0" y2="675.0"/>
  <line fill="none" marker-end="url(#arrowBlue)" opacity="1" stroke="#1C65BD" stroke-linecap="round" stroke-width="4.4" x1="170.0" x2="232.9298938467752" y1="675.0" y2="197.0"/>
  <line fill="none" marker-end="url(#arrowBlue)" opacity="1" stroke="#1C65BD" stroke-linecap="round" stroke-width="4.4" x1="170.0" x2="1555" y1="675.0" y2="492.6612908414568"/>
  <line fill="none" opacity="1" stroke="#00877D" stroke-linecap="round" stroke-width="3.6" x1="106.76399058625503" x2="170.0" y1="911.0" y2="675.0"/>
  <line fill="none" marker-end="url(#arrowGreen)" opacity="1" stroke="#00877D" stroke-linecap="round" stroke-width="4.4" x1="170.0" x2="299.15151075180114" y1="675.0" y2="193.0"/>
  <line fill="none" marker-end="url(#arrowGreen)" opacity="1" stroke="#00877D" stroke-linecap="round" stroke-width="4.4" x1="170.0" x2="1525" y1="675.0" y2="311.9288442558287"/>
  <!-- Observer D is stationary relative to A (x=constant), passing through E. -->
  <line fill="none" marker-end="url(#arrowPurple)" stroke="#6D46B5" stroke-linecap="round" stroke-width="4.4" x1="1347.3418874723984" x2="1347.3418874723984" y1="884" y2="226"/>
  <text fill="#6D46B5" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" x="1366" y="264">D's worldline</text>
  <circle cx="1347.3418874723984" cy="520.0" fill="#10213D" r="8.5" stroke="#FFFFFF" stroke-width="2.4"/>
  <text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="bold" x="1364.3418874723984" y="499.0">E</text>
  <text fill="#6D46B5" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" x="1371" y="554">D observes E locally</text>
  <circle cx="123.6769339379839" cy="847.8800361058136" fill="#00877D" r="6.7" stroke="#FFFFFF" stroke-width="2"/>
  <text fill="#00877D" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" x="166" y="867">t'' &lt; 0</text>
  <circle cx="170.0" cy="675.0" fill="#101820" r="7.5" stroke="#FFFFFF" stroke-width="2.0"/>
  <text fill="#101820" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" x="72" y="704">(0,0)</text>
  <text fill="#D97818" font-family="Arial, Helvetica, sans-serif" font-size="25" font-style="italic" x="145" y="168">ct</text>
  <text fill="#D97818" font-family="Arial, Helvetica, sans-serif" font-size="27" font-style="italic" x="1606" y="688">x</text>
  <text fill="#1C65BD" font-family="Arial, Helvetica, sans-serif" font-size="25" font-style="italic" font-weight="bold" x="219" y="172">ct'</text>
  <text fill="#1C65BD" font-family="Arial, Helvetica, sans-serif" font-size="27" font-style="italic" font-weight="bold" x="1578" y="499.6612908414568">x'</text>
  <text fill="#00877D" font-family="Arial, Helvetica, sans-serif" font-size="25" font-style="italic" font-weight="bold" x="317" y="165">ct''</text>
  <text fill="#00877D" font-family="Arial, Helvetica, sans-serif" font-size="27" font-style="italic" font-weight="bold" x="1547" y="318.9288442558287">x''</text>
  <text fill="#1C65BD" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" transform="rotate(-7.5 814 567)" x="814" y="567">B's present slice</text>
  <text fill="#1C65BD" font-family="Arial, Helvetica, sans-serif" font-size="19" x="1040" y="772">B: 75° between blue axes</text>
  <text fill="#00877D" font-family="Arial, Helvetica, sans-serif" font-size="19" x="1040" y="804">C: 60° between green axes</text>
  <text fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="18" x="1040" y="834">Angles drawn in the x–ct plane</text>
  <rect fill="#F4F7FB" height="78" rx="10" stroke="#DCE5F0" stroke-width="1.2" width="1576" x="48" y="963"/>
  <text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" x="68" y="994">Legend</text>
  <line x1="169" y1="987" x2="216" y2="987" stroke="#D97818" stroke-width="3.6" stroke-linecap="round"/>
  <text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="18" x="226" y="995">A axes</text>
  <line x1="333" y1="987" x2="380" y2="987" stroke="#1C65BD" stroke-width="3.6" stroke-linecap="round"/>
  <text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="18" x="390" y="995">B axes</text>
  <line x1="497" y1="987" x2="544" y2="987" stroke="#00877D" stroke-width="3.6" stroke-linecap="round"/>
  <text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="18" x="554" y="995">C axes</text>
  <line x1="659" y1="987" x2="706" y2="987" stroke="#6D46B5" stroke-width="3.6" stroke-linecap="round"/>
  <text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="18" x="716" y="995">D worldline</text>
  <line x1="884" y1="987" x2="931" y2="987" stroke="#D97818" stroke-width="3.2" stroke-dasharray="10 6" stroke-linecap="round"/>
  <text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="18" x="941" y="995">A future</text>
  <line x1="1098" y1="987" x2="1145" y2="987" stroke="#00877D" stroke-width="3.2" stroke-dasharray="10 6" stroke-linecap="round"/>
  <text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="18" x="1155" y="995">C past</text>
  <line x1="1292" y1="987" x2="1339" y2="987" stroke="#93A3B8" stroke-width="2.5" stroke-dasharray="7 7" stroke-linecap="round"/>
  <text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="18" x="1349" y="995">Light cone</text>
  <text fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="16" x="67" y="1027">All axes originate at (0,0); the slice labels describe the temporal coordinates assigned to event E.</text>
  <line fill="none" opacity="1" stroke="#DDE6F0" stroke-linecap="round" stroke-width="1.4" x1="50" x2="1623" y1="1064" y2="1064"/>
  <text fill="#10213D" font-family="Liberation Serif, Georgia, serif" font-size="24" font-weight="bold" x="51" y="1105">Figure 1.1.</text>
  <text fill="#10213D" font-family="Liberation Serif, Georgia, serif" font-size="23" font-style="italic" x="185" y="1105">Minkowski spacetime diagram illustrating tilted axes and different hypersurfaces of simultaneity for inertial observers in relative motion.</text>
  <text fill="#10213D" font-family="Liberation Serif, Georgia, serif" font-size="23" x="51" y="1146">Event E is simultaneous with B's origin (t' = 0), but is in A's future (t &gt; 0) and C's past (t'' &lt; 0). Grey dashed lines</text>
  <text fill="#10213D" font-family="Liberation Serif, Georgia, serif" font-size="23" x="51" y="1183">mark the 45° light cone. The vertical coordinate is ct, with matching coordinate scales for x and ct; the diagram is schematic.</text>
</svg>
