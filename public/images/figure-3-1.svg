<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="1080" viewBox="0 0 1672 1080" role="img" aria-labelledby="title desc">
<title id="title">Figure 3.1 — Dynamic evolution and block-universe description</title>
<desc id="desc">Left: four spatial snapshots ordered from t1 at the bottom to t4 at the top, showing two bodies approaching and then passing one another. Right: the exact same four sets of body positions sampled on continuous blue and orange worldlines at the matching time slices, with ct increasing upward. Both representations describe the same physical history.</desc>
<defs><linearGradient id="header" x2="0" y2="1"><stop stop-color="#e7f0fb"/><stop offset="1" stop-color="#f7fafd"/></linearGradient><marker id="navyArrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#122744"/></marker><marker id="blueArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8Z" fill="#116ac5"/></marker><marker id="orangeArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8Z" fill="#ed7906"/></marker></defs>
<rect width="1672" height="1080" fill="white"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#122744">
<rect x="32" y="35" width="764" height="738" rx="17" fill="white" stroke="#9bb2d1" stroke-width="1.5"/>
<rect x="819" y="35" width="820" height="738" rx="17" fill="white" stroke="#9bb2d1" stroke-width="1.5"/>
<path d="M49 35H779Q796 35 796 53V96H32V53Q32 35 49 35Z" fill="url(#header)"/>
<path d="M836 35H1622Q1639 35 1639 53V96H819V53Q819 35 836 35Z" fill="url(#header)"/>
<text x="57" y="77" font-size="27" font-weight="bold">A. Dynamic description: successive 3D states</text>
<text x="845" y="77" font-size="27" font-weight="bold">B. Block-universe description: one 4D history</text>
<text x="81" y="147" font-family="Georgia,serif" font-size="23" font-style="italic">Time</text>
<path d="M111 735V166" stroke="#122744" stroke-width="3.5" marker-end="url(#navyArrow)"/>
<!-- Spatial snapshots are samples of exactly the same blue/orange worldlines at the four labeled time slices. The t4-to-t1 screen order matches the upward ct axis. -->
<g><rect x="161" y="170" width="387" height="115" rx="15" fill="#f7faff" stroke="#8aa9ce" stroke-width="1.5"/><rect x="419" y="179" width="112" height="33" rx="9" fill="#e0ebf8" stroke="#bfd1e6"/><text x="475" y="202" font-size="19" text-anchor="middle">state at t4</text><circle cx="400" cy="239" r="11" fill="#116ac5"/><circle cx="260" cy="239" r="11" fill="#ed7906"/></g>
<g><rect x="161" y="310" width="387" height="115" rx="15" fill="#f7faff" stroke="#8aa9ce" stroke-width="1.5"/><rect x="419" y="319" width="112" height="33" rx="9" fill="#e0ebf8" stroke="#bfd1e6"/><text x="475" y="342" font-size="19" text-anchor="middle">state at t3</text><circle cx="344" cy="379" r="11" fill="#116ac5"/><circle cx="315" cy="379" r="11" fill="#ed7906"/></g>
<g><rect x="161" y="450" width="387" height="115" rx="15" fill="#f7faff" stroke="#8aa9ce" stroke-width="1.5"/><rect x="419" y="459" width="112" height="33" rx="9" fill="#e0ebf8" stroke="#bfd1e6"/><text x="475" y="482" font-size="19" text-anchor="middle">state at t2</text><circle cx="270" cy="519" r="11" fill="#116ac5"/><circle cx="371" cy="519" r="11" fill="#ed7906"/></g>
<g><rect x="161" y="590" width="387" height="115" rx="15" fill="#f7faff" stroke="#8aa9ce" stroke-width="1.5"/><rect x="419" y="599" width="112" height="33" rx="9" fill="#e0ebf8" stroke="#bfd1e6"/><text x="475" y="622" font-size="19" text-anchor="middle">state at t1</text><circle cx="222" cy="659" r="11" fill="#116ac5"/><circle cx="382" cy="659" r="11" fill="#ed7906"/></g>
<circle cx="111" cy="229" r="24" fill="#ecf4fd" stroke="#bfd1e6"/><text x="111" y="237" text-anchor="middle" font-family="Georgia,serif" font-size="25" font-style="italic">t4</text>
<circle cx="111" cy="369" r="24" fill="#ecf4fd" stroke="#bfd1e6"/><text x="111" y="377" text-anchor="middle" font-family="Georgia,serif" font-size="25" font-style="italic">t3</text>
<circle cx="111" cy="509" r="24" fill="#ecf4fd" stroke="#bfd1e6"/><text x="111" y="517" text-anchor="middle" font-family="Georgia,serif" font-size="25" font-style="italic">t2</text>
<circle cx="111" cy="649" r="24" fill="#ecf4fd" stroke="#bfd1e6"/><text x="111" y="657" text-anchor="middle" font-family="Georgia,serif" font-size="25" font-style="italic">t1</text>
