<text x="590" y="225" font-size="20">Each panel shows</text><text x="590" y="254" font-size="20">a spatial</text><text x="590" y="283" font-size="20">configuration</text><text x="590" y="312" font-size="20">of the system</text><text x="590" y="341" font-size="20">at one time.</text>
<path d="M590 370H745" stroke="#b7c8de"/><text x="590" y="410" font-size="20">Evolution is</text><text x="590" y="439" font-size="20">described as a</text><text x="590" y="468" font-size="20">sequence of</text><text x="590" y="497" font-size="20">successive states.</text>
