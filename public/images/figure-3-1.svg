<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="1080" viewBox="0 0 1672 1080" role="img" aria-labelledby="title desc">
<title id="title">Figure 3.1 — Dynamic evolution and block-universe description</title>
<desc id="desc">Left: four time-ordered snapshots of two bodies approaching then moving apart. Right: the same positions represented as blue and orange worldlines in one complete spacetime. Both describe the same physics with differing ontological interpretation.</desc>
