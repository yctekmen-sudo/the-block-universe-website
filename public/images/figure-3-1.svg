<rect x="1400" y="156" width="200" height="424" rx="15" fill="#f7f9fd" stroke="#a9bcd5"/>
<text x="1418" y="193" font-size="20">The entire</text><text x="1418" y="223" font-size="20">evolution is</text><text x="1418" y="253" font-size="20">represented</text><text x="1418" y="283" font-size="20">at once as two</text><text x="1418" y="313" font-size="20">worldlines in</text><text x="1418" y="343" font-size="20">spacetime.</text><path d="M1418 365H1583" stroke="#b7c8de"/><text x="1418" y="408" font-size="20">The times are</text><text x="1418" y="438" font-size="20">different slices</text><text x="1418" y="468" font-size="20">through the same</text><text x="1418" y="498" font-size="20">four-dimensional</text><text x="1418" y="528" font-size="20">history.</text>
<rect x="839" y="692" width="779" height="58" rx="13" fill="#fff" stroke="#a9bcd5"/>
<text x="861" y="728" font-size="20" font-weight="bold">Legend:</text><path d="M967 720h36" stroke="#116ac5" stroke-width="4"/><text x="1012" y="728" font-size="18">Body A</text><path d="M1125 720h36" stroke="#ed7906" stroke-width="4"/><text x="1170" y="728" font-size="18">Body B</text><path d="M1285 720h45" stroke="#9bb8dc" stroke-dasharray="5 6" stroke-width="2"/><text x="1340" y="728" font-size="18">Time slice</text>
<rect x="32" y="790" width="1607" height="72" rx="15" fill="#edf3fb" stroke="#9bb2d1"/><text x="72" y="835" font-size="25" font-weight="bold">Key insight:</text><text x="286" y="835" font-size="23">Same physical evolution; different interpretations of its existence in time.</text>
</g>
<g fill="#121212" font-family="Georgia,'Liberation Serif',serif" font-size="27">
<text x="34" y="911" font-weight="bold">Figure 3.1.</text><text x="182" y="911" font-style="italic">Dynamic description and block-universe description of the same physical evolution.</text>
<text x="34" y="951">(A) A system represented as a sequence of spatial states ordered by time. (B) The same</text>
<text x="34" y="990">system represented as a single spacetime history containing two complete worldlines.</text>
<text x="34" y="1029">The laws may describe the same relationships; the difference is ontological.</text>
</g></svg>