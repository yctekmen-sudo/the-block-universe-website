font-size="26"><text x="39" y="982" font-size="27" font-weight="bold">Figure 4.4.</text><text x="199" y="982" font-size="27" font-style="italic">Individual detection events and the double-slit interference pattern.</text><text x="39" y="1021" font-size="25" >(A) The arrangement contains a source, two slits, and a screen. (B) A trial produces one</text><text x="39" y="1056" font-size="25" >localized detection. (C) Many trials yield the familiar interference distribution P(x).</text><text x="39" y="1090" font-size="25" >The actual history contains definite records; quantum mechanics predicts their statistics.</text></g></svg>