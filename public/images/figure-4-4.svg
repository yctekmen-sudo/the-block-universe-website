<title id="title">Figure 4.4. Double-slit experiment: individual detections and interference pattern</title>
<desc id="desc">Three panels: A source emits toward a double slit and detection screen; a sequence of individual trials each has one localized detector impact; many impacts form an interference pattern described by a statistical detection probability. A recorded dot belongs to a single history, whereas the pattern describes many trials.</desc>
