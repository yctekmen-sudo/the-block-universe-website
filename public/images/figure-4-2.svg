<rect x="48" y="754" width="1576" height="75" rx="10" fill="#F4F7FB" stroke="#E0E7F0" stroke-width="1.1"/>
<text x="83" y="789" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#10213D" font-weight="bold">Deterministic response example:</text>
<text x="469" y="789" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1C65BD" font-weight="bold">A = A(a, λ)</text>
<text x="857" y="789" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#00877D" font-weight="bold">B = B(b, λ)</text>
<text x="83" y="815" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#536680">The manuscript also permits stochastic local responses; the apparatus alone does not assume independence of settings from λ.</text>
<path d="M51 852 H1621" fill="none" stroke="#DDE6F0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="51" y="892" font-family="Liberation Serif, Georgia, serif" font-size="24" fill="#10213D" font-weight="bold">Figure 4.2.</text>
<text x="197" y="892" font-family="Liberation Serif, Georgia, serif" font-size="24" fill="#10213D" font-style="italic">Bell-test arrangement, measurement settings, outcomes, and proposed hidden variables.</text>
<text x="51" y="937" font-family="Liberation Serif, Georgia, serif" font-size="24" fill="#10213D">A source prepares a pair sent to spatially separated stations. Alice selects setting a and records outcome A; Bob selects setting b and records</text>
<text x="51" y="971" font-family="Liberation Serif, Georgia, serif" font-size="24" fill="#10213D">outcome B. In a local hidden-variable description, λ denotes the relevant underlying state of the pair, and local responses use (a, λ) and</text>
<text x="51" y="1005" font-family="Liberation Serif, Georgia, serif" font-size="24" fill="#10213D">(b, λ). The diagram does not assume measurement independence P(λ|a,b) = P(λ), nor does it depict communication between the stations.</text>
</svg>
