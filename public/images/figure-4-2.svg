<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="1080" viewBox="0 0 1672 1080" role="img" aria-labelledby="figtitle figdesc">
<title id="figtitle">Figure 4.2: Bell-test arrangement and physical variables</title>
<desc id="figdesc">A Bell experiment with a central pair source and two separated measurement stations. Alice chooses local setting a and measures outcome A, while Bob chooses local setting b and measures outcome B. A proposed underlying hidden variable lambda describes the pair. Only paths from the source toward the stations are drawn; the schematic does not assume measurement independence or communication between Alice and Bob.</desc>
