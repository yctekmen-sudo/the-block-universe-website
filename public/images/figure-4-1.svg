<text x="1227.0" y="561" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#007E74" font-weight="bold" text-anchor="middle">50% of pairs</text>
<circle cx="1323" cy="576" r="28" fill="#1C65BD" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="1323" y="585" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#FFFFFF" font-weight="bold" text-anchor="middle">B</text>
<text x="1323" y="622" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#536680" text-anchor="middle">A</text>
<circle cx="1468" cy="576" r="28" fill="#C6533F" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="1468" y="585" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#FFFFFF" font-weight="bold" text-anchor="middle">R</text>
<text x="1468" y="622" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#536680" text-anchor="middle">B</text>
<text x="1394" y="585" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#536680" text-anchor="middle">&amp;</text>
<text x="1371" y="519" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#007E74" font-weight="bold" text-anchor="middle">OR</text>
<text x="1371" y="675" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#10213D" text-anchor="middle">Each alternative is a product state.</text>
<text x="1371" y="710" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#007E74" font-weight="bold" text-anchor="middle">A separable, classically correlated ensemble</text>
<rect x="48" y="762" width="1576" height="46" rx="9" fill="#F4F7FB" stroke="#E0E7F0" stroke-width="1"/>
<text x="836" y="791" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#10213D" text-anchor="middle">Key distinction: superposition concerns components of a state; entanglement concerns the separability of subsystems.</text>
<line x1="50" y1="834" x2="1621" y2="834" stroke="#DDE6F0" stroke-width="1.4" stroke-linecap="round"/>
<text x="51" y="873" font-family="Liberation Serif, Georgia, serif" font-size="24" fill="#10213D" font-weight="bold">Figure 4.1.</text>
<text x="197" y="873" font-family="Liberation Serif, Georgia, serif" font-size="24" fill="#10213D" font-style="italic">Superposition, entanglement, and classical correlation.</text>
<text x="51" y="918" font-family="Liberation Serif, Georgia, serif" font-size="23" fill="#10213D">(A) A single system may be in a superposition without being entangled. (B) An entangled pure state is a coherent, non-factorizable joint state; its two terms are not</text>
<text x="51" y="953" font-family="Liberation Serif, Georgia, serif" font-size="23" fill="#10213D">preassigned classical pair types. (C) A classically correlated mixed state can instead be a probabilistic mixture of product states, and is therefore separable. The</text>
<text x="51" y="988" font-family="Liberation Serif, Georgia, serif" font-size="23" fill="#10213D">pair basis order is (A, B). R and B denote the abstract basis labels used in Section 4.2; colored symbols are visual aids, not particle trajectories.</text>
</svg>
