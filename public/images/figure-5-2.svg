<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1166" version="1.1" viewBox="0 0 1672 1166" width="1672" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">Figure 5.3 — Deliberation along an observer's worldline</title><desc id="figure-description">Panel A depicts one actual worldline containing memory, consideration of options A and B, the realized decision A, and later action. Panel B distinguishes represented alternatives and other possible complete histories from the one actual history, with deliberation and its causal role retained.</desc><defs /><rect fill="#FFFFFF" height="1166" width="1672" x="0" y="0" /><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="32" font-style="normal" font-weight="bold" text-anchor="start" x="48" y="55">Deliberation and the realized decision within one history</text><text fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="20" font-style="normal" font-weight="normal" text-anchor="start" x="49" y="91">The person’s reasoning and outcome are physical events in the complete four-dimensional history.</text><rect fill="#FFFFFF" height="778" rx="12" stroke="#C5D0DE" stroke-width="1.5" width="829" x="46" y="128" /><rect fill="#FFFFFF" height="778" rx="12" stroke="#C5D0DE" stroke-width="1.5" width="731" x="894" y="128" /><rect fill="#EAF1F9" height="62" rx="12" stroke="none" stroke-width="1.5" width="827" x="47" y="129" /><rect fill="#EAF1F9" height="62" rx="12" stroke="none" stroke-width="1.5" width="729" x="895" y="129" /><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="25" font-style="normal" font-weight="bold" text-anchor="start" x="71" y="169">A. One actual observer worldline</text><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="23" font-style="normal" font-weight="bold" text-anchor="start" x="919" y="169">B. Alternatives considered; one outcome realized</text><line stroke="#10213D" stroke-linecap="round" stroke-width="3" x1="148" x2="148" y1="811" y2="238" /><polygon fill="#10213D" points="148,222 139,241 157,241" /><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="25" font-style="italic" font-weight="normal" text-anchor="start" x="125" y="214">ct</text><text fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="17" font-style="normal" font-weight="normal" text-anchor="start" x="102" y="848">Observer’s physical states</text><path d="M 423 819 C 402 740 475 693 462 621 C 447 554 393 508 429 431 C 460 361 411 312 414 258" fill="none" stroke="#1C65BD" stroke-linecap="round" stroke-width="6" /><circle cx="423" cy="791" fill="#00877D" r="11" stroke="#fff" stroke-width="2.5" /><line stroke="#9FB1C4" stroke-dasharray="6 7" stroke-linecap="round" stroke-width="1.4" x1="159" x2="391" y1="791" y2="791" /><text fill="#00877D" font-family="Arial, Helvetica, sans-serif" font-size="19" font-style="normal" font-weight="bold" text-anchor="start" x="169" y="781">S₁</text><circle cx="453" cy="625" fill="#6D46B5" r="11" stroke="#fff" stroke-width="2.5" /><line stroke="#9FB1C4" stroke-dasharray="6 7" stroke-linecap="round" stroke-width="1.4" x1="159" x2="391" y1="625" y2="625" /><text fill="#6D46B5" font-family="Arial, Helvetica, sans-serif" font-size="19" font-style="normal" font-weight="bold" text-anchor="start" x="169" y="615">S₂</text><circle cx="425" cy="439" fill="#D97818" r="11" stroke="#fff" stroke-width="2.5" /><line stroke="#9FB1C4" stroke-dasharray="6 7" stroke-linecap="round" stroke-width="1.4" x1="159" x2="391" y1="439" y2="439" /><text fill="#D97818" font-family="Arial, Helvetica, sans-serif" font-size="19" font-style="normal" font-weight="bold" text-anchor="start" x="169" y="429">S₃</text><circle cx="414" cy="274" fill="#00877D" r="11" stroke="#fff" stroke-width="2.5" /><line stroke="#9FB1C4" stroke-dasharray="6 7" stroke-linecap="round" stroke-width="1.4" x1="159" x2="391" y1="274" y2="274" /><text fill="#00877D" font-family="Arial, Helvetica, sans-serif" font-size="19" font-style="normal" font-weight="bold" text-anchor="start" x="169" y="264">S₄</text><rect fill="#F7FAFD" height="76" rx="9" stroke="#D5E1EF" stroke-width="1.3" width="332" x="503" y="783" /><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="23" font-style="normal" font-weight="bold" text-anchor="start" x="519" y="817">Experience and memory</text><text fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="17" font-style="normal" font-weight="normal" text-anchor="start" x="519" y="845">Inputs include earlier records</text><line stroke="#93A3B8" stroke-dasharray="4 6" stroke-linecap="round" stroke-width="1.6" x1="441" x2="497" y1="791" y2="791" /><rect fill="#F7FAFD" height="76" rx="9" stroke="#D5E1EF" stroke-width="1.3" width="332" x="503" y="614" /><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="23" font-style="normal" font-weight="bold" text-anchor="start" x="519" y="648">Deliberation</text><text fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="17" font-style="normal" font-weight="normal" text-anchor="start" x="519" y="676">Reasons, preferences, A / B</text><line stroke="#93A3B8" stroke-dasharray="4 6" stroke-linecap="round" stroke-width="1.6" x1="471" x2="497" y1="625" y2="625" /><rect fill="#F7FAFD" height="76" rx="9" stroke="#D5E1EF" stroke-width="1.3" width="332" x="503" y="427" /><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="23" font-style="normal" font-weight="bold" text-anchor="start" x="519" y="461">Decision: A</text><text fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="17" font-style="normal" font-weight="normal" text-anchor="start" x="519" y="489">A becomes the actual outcome</text><line stroke="#93A3B8" stroke-dasharray="4 6" stroke-linecap="round" stroke-width="1.6" x1="443" x2="497" y1="439" y2="439" /><rect fill="#F7FAFD" height="76" rx="9" stroke="#D5E1EF" stroke-width="1.3" width="332" x="503" y="265" /><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="23" font-style="normal" font-weight="bold" text-anchor="start" x="519" y="299">Action and record</text><text fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="17" font-style="normal" font-weight="normal" text-anchor="start" x="519" y="327">Consequences are physically recorded</text><line stroke="#93A3B8" stroke-dasharray="4 6" stroke-linecap="round" stroke-width="1.6" x1="432" x2="497" y1="274" y2="274" /><rect fill="#EAF7F4" height="41" rx="8" stroke="#A7CFC7" stroke-width="1.0" width="410" x="249" y="210" /><text fill="#00877D" font-family="Arial, Helvetica, sans-serif" font-size="18" font-style="normal" font-weight="bold" text-anchor="middle" x="454" y="238">Complete realized trajectory</text><text fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="17" font-style="normal" font-weight="normal" text-anchor="start" x="140" y="881">Proper time increases along the observer’s worldline.</text><rect fill="#F7FAFD" height="235" rx="12" stroke="#C5D0DE" stroke-width="1.5" width="681" x="919" y="218" /><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="23" font-style="normal" font-weight="bold" text-anchor="start" x="946" y="254">Inside the deliberative physical state</text><text fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="19" font-style="normal" font-weight="normal" text-anchor="start" x="946" y="289">The agent evaluates represented alternatives:</text><rect fill="#EAF1F9" height="96" rx="12" stroke="#BCD0E7" stroke-width="1.2" width="245" x="967" y="316" /><rect fill="#F7F3FC" height="96" rx="12" stroke="#D8C8ED" stroke-width="1.2" width="245" x="1298" y="316" /><text fill="#1C65BD" font-family="Arial, Helvetica, sans-serif" font-size="25" font-style="normal" font-weight="bold" text-anchor="middle" x="1089" y="351">Option A</text><text fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="19" font-style="normal" font-weight="normal" text-anchor="middle" x="1089" y="383">Considered</text><text fill="#6D46B5" font-family="Arial, Helvetica, sans-serif" font-size="25" font-style="normal" font-weight="bold" text-anchor="middle" x="1420" y="351">Option B</text><text fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="19" font-style="normal" font-weight="normal" text-anchor="middle" x="1420" y="383">Considered</text><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="23" font-style="normal" font-weight="normal" text-anchor="middle" x="1258" y="376">or</text><rect fill="#EAF7F4" height="118" rx="12" stroke="#A7CFC7" stroke-width="1.5" width="674" x="922" y="482" /><text fill="#00877D" font-family="Arial, Helvetica, sans-serif" font-size="23" font-style="normal" font-weight="bold" text-anchor="start" x="949" y="518">Actual history</text><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="21" font-style="normal" font-weight="normal" text-anchor="start" x="949" y="550">Deliberation → decision A → action A</text><text fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="18" font-style="normal" font-weight="normal" text-anchor="start" x="949" y="577">One realized outcome, not two actual branches</text><rect fill="#FFF8EE" height="136" rx="12" stroke="#E5CBA8" stroke-width="1.5" width="674" x="922" y="628" /><text fill="#D97818" font-family="Arial, Helvetica, sans-serif" font-size="22" font-style="normal" font-weight="bold" text-anchor="start" x="949" y="665">Possible alternative history</text><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="20" font-style="normal" font-weight="normal" text-anchor="start" x="949" y="700">A history with decision B may be considered.</text><text fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="18" font-style="normal" font-weight="normal" text-anchor="start" x="949" y="729">Its possibility is not settled by Block Universe ontology.</text><text fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="19" font-style="italic" font-weight="normal" text-anchor="start" x="935" y="821">No selector outside spacetime is depicted or assumed.</text><rect fill="#F4F7FB" height="77" rx="10" stroke="#DFE7F0" stroke-width="1.2" width="1579" x="46" y="926" /><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="22" font-style="normal" font-weight="bold" text-anchor="start" x="67" y="961">Key distinction:</text><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="21" font-style="normal" font-weight="normal" text-anchor="start" x="256" y="961">The deliberation is real and causally relevant within the history;</text><text fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="21" font-style="normal" font-weight="normal" text-anchor="start" x="256" y="990">it does not imply an extra power to choose which complete history exists.</text><line stroke="#DDE6F0" stroke-linecap="round" stroke-width="1.4" x1="48" x2="1624" y1="1024" y2="1024" /><text fill="#10213D" font-family="Liberation Serif, Georgia, serif" font-size="24" font-style="normal" font-weight="bold" text-anchor="start" x="50" y="1064">Figure 5.3.</text><text fill="#10213D" font-family="Liberation Serif, Georgia, serif" font-size="24" font-style="italic" font-weight="normal" text-anchor="start" x="193" y="1064">Deliberation along an observer’s worldline.</text><text fill="#10213D" font-family="Liberation Serif, Georgia, serif" font-size="23" font-style="normal" font-weight="normal" text-anchor="start" x="50" y="1102">The actual history contains memory, evaluation of alternatives, a realized decision, and subsequent action.</text><text fill="#10213D" font-family="Liberation Serif, Georgia, serif" font-size="23" font-style="normal" font-weight="normal" text-anchor="start" x="50" y="1135">Represented alternatives are not additional realized branches; the Block Universe does not select why this history is actual.</text></svg>