<text x="1451" y="733" font-family="Tinos, Times New Roman, serif" font-size="21" fill="#050505" font-weight="normal" font-style="normal" text-anchor="start" >( c|Δt| = |Δx| )</text>
<text x="28" y="797" font-family="Tinos, Times New Roman, serif" font-size="27" fill="#090909"><tspan font-weight="bold" font-style="normal">Figure 1.2. </tspan><tspan font-weight="normal" font-style="italic">The extension from local physical reality to a complete four-dimensional history.</tspan><tspan font-weight="normal" font-style="normal"> (A) An event E on observer D’s worldline and a</tspan></text>
<text x="28" y="830" font-family="Tinos, Times New Roman, serif" font-size="27" fill="#090909"><tspan font-weight="normal" font-style="normal">nearby event Y, occupied by observer B, spacelike-separated from E and simultaneous with E in a suitable frame. (B) A spacelike chain P – R – Q</tspan></text>
<text x="28" y="861" font-family="Tinos, Times New Roman, serif" font-size="27" fill="#090909"><tspan font-weight="normal" font-style="normal">in which P and Q are timelike-separated, while P – R and R – Q are spacelike-separated. By connecting such pairs and </tspan><tspan font-weight="normal" font-style="italic">adopting transitivity of</tspan></text>
<text x="28" y="893" font-family="Tinos, Times New Roman, serif" font-size="27" fill="#090909"><tspan font-weight="normal" font-style="italic">co-reality, the construction extends to a complete four-dimensional history.</tspan></text>
</svg>
