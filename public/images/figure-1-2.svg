<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="figtitle figdesc">
<title id="figtitle">Figure 1.2: The extension from local physical reality to a complete four-dimensional history</title>
<desc id="figdesc">Two panels. Panel A shows observer D's timelike worldline containing event E and an alternative spatially separated observer B at event Y, simultaneous in F. Panel B shows timelike-separated P and Q and a spacelike chain through R, with orange F1 and teal F2 simultaneity lines. The legend uses colored line samples and names the light cone of P.</desc>
