<text x="459" y="231" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#1C65BD" font-weight="bold">S₃</text>
<text x="508" y="231" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#536680">(T₃)</text>
<text x="80" y="670" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1C65BD">Blue line: observer’s timelike worldline</text>
<text x="80" y="694" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#10213D">All three states belong to the actual history.</text>
<text x="763" y="214" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#00877D" font-weight="bold">Earlier</text>
<text x="1100" y="214" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#D97818" font-weight="bold" text-anchor="middle">Reference state</text>
<text x="1472" y="214" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#536680" font-weight="bold" text-anchor="middle">Later</text>
<rect x="757" y="235" width="228" height="106" rx="11" fill="#F0FAF8" stroke="#A7CFC7" stroke-width="1.5"/>
<rect x="998" y="225" width="313" height="127" rx="12" fill="#FFF8F0" stroke="#E8BE8D" stroke-width="2"/>
<rect x="1324" y="235" width="269" height="106" rx="11" fill="#F7F8FA" stroke="#C8D0D9" stroke-width="1.5"/>
<text x="871" y="275" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#00877D" font-weight="bold" text-anchor="middle">S₁</text>
<text x="871" y="307" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#10213D" text-anchor="middle">Earlier encounter</text>
<text x="1154" y="269" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#D97818" font-weight="bold" text-anchor="middle">S₂</text>
<text x="1154" y="305" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#10213D" text-anchor="middle">Brain state with records</text>
<text x="1154" y="331" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#536680" text-anchor="middle">(observer’s viewpoint)</text>
<text x="1458" y="275" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#536680" font-weight="bold" text-anchor="middle">S₃</text>
<text x="1458" y="307" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#10213D" text-anchor="middle">Later encounter</text>
<line x1="986" y1="286" x2="995" y2="286" stroke="#00877D" stroke-width="3.8" marker-end="url(#teal-arrow)" stroke-linecap="round"/>
<rect x="757" y="383" width="836" height="99" rx="12" fill="#F0FAF8" stroke="#A7CFC7" stroke-width="1.2"/>
<rect x="773" y="397" width="45" height="45" rx="22" fill="#00877D" stroke="#00877D" stroke-width="0"/>
<path d="M 785 419 L 793 427 L 807 411" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="840" y="414" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#10213D" font-weight="bold">S₂ contains information about aspects of S₁</text>
<text x="840" y="446" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#536680">Records result from earlier physical interactions.</text>
<rect x="757" y="502" width="836" height="99" rx="12" fill="#F8F9FB" stroke="#D0D8E1" stroke-width="1.2"/>
<rect x="773" y="517" width="45" height="45" rx="22" fill="#E1E6ED" stroke="#E1E6ED" stroke-width="0"/>
<text x="795" y="549" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#5A6A7E" font-weight="bold" text-anchor="middle">–</text>
<text x="840" y="533" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#10213D" font-weight="bold">S₂ does not ordinarily contain records formed at S₃</text>
<text x="840" y="566" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#536680">This does not imply that S₃ is nonexistent.</text>
<line x1="757" y1="627" x2="1592" y2="627" stroke="#C5D0DE" stroke-width="1.2" stroke-linecap="round"/>
<text x="759" y="661" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#536680">The asymmetry concerns records, not the amount of stored information.</text>
<text x="759" y="688" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#536680">Forgetting and loss of memory are physically possible.</text>
<rect x="47" y="742" width="1579" height="69" rx="9" fill="#F5F8FC" stroke="#C5D0DE" stroke-width="1.1"/>
<text x="72" y="768" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#10213D" font-weight="bold">Key distinction</text>
<text x="260" y="768" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#10213D">Earlier / later are relations to an observer’s state; they are not different modes of existence.</text>
<text x="260" y="794" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#536680">No global present is depicted as moving along the worldline.</text>
<text x="54" y="852" font-family="Liberation Serif, Georgia, serif" font-size="22" fill="#10213D" font-weight="bold">Figure 2.1.</text>
<text x="184" y="852" font-family="Liberation Serif, Georgia, serif" font-size="22" fill="#10213D" font-style="italic">Information asymmetry along an observer’s worldline.</text>
<text x="54" y="893" font-family="Liberation Serif, Georgia, serif" font-size="25" fill="#10213D">The physical state S₂ contains records arising from earlier interactions, including aspects of S₁, but does not ordinarily</text>
<text x="54" y="930" font-family="Liberation Serif, Georgia, serif" font-size="25" fill="#10213D">contain records produced at S₃. All three states are parts of one four-dimensional history. The asymmetry provides a physical</text>
<text x="54" y="967" font-family="Liberation Serif, Georgia, serif" font-size="25" fill="#10213D">basis for distinguishing past from future without requiring time itself to flow or memories to accumulate without loss.</text>
</svg>
