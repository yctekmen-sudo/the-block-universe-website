<text x="441" y="596" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#536680">(T₁)</text>
<circle cx="338" cy="398" r="11" fill="#D97818" stroke="#FFFFFF" stroke-width="3"/>
