<text x="77" y="160" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#10213D" font-weight="bold">A. Three physical states in spacetime</text>
<text x="757" y="160" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#10213D" font-weight="bold">B. The information available at state S₂</text>
