<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="1010" viewBox="0 0 1672 1010" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Figure 2.1: Information asymmetry along an observer’s worldline</title>
<desc id="figure-desc">Two panels. Panel A shows three physical observer states S1, S2 and S3 along a future-directed timelike worldline in a static spacetime diagram. Panel B centers the physical state S2: it contains records of earlier interactions involving S1, but does not ordinarily contain records made at later state S3. All three states are equally part of the actual Block Universe. Memory need not monotonically increase.</desc>
<defs>
<marker id="axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#10213D"/></marker>
<marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#00877D"/></marker>
</defs>
<rect x="0" y="0" width="1672" height="1010" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="59" y="55" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#10213D" font-weight="bold">Information asymmetry along an observer’s worldline</text>
<text x="60" y="89" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#536680">Physical records—not an advancing present—distinguish earlier from later states</text>
