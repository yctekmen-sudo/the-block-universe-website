<text x="475" y="405" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#536680">(T₂)</text>
<circle cx="371" cy="224" r="11" fill="#1C65BD" stroke="#FFFFFF" stroke-width="3"/>
