<text x="69" y="339" font-size="20" font-family="Arial,Helvetica,sans-serif" fill="#536680">x · y = +1</text>
<text x="69" y="394" font-size="20" font-family="Arial,Helvetica,sans-serif" fill="#122744" font-weight="bold">λ = (λ₁, λ₂)</text>
<text x="379" y="394" font-size="20" font-family="Arial,Helvetica,sans-serif" fill="#122744" font-weight="bold">ρ(λ | x,y)</text>
