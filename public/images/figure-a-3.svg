<rect x="43" y="892" width="1586" height="98" rx="12" fill="#f5f8fd" stroke="#b8cbe0"/>
<text x="68" y="932" font-family="Arial,Helvetica,sans-serif" fill="#122744" font-size="25" font-weight="bold">What changes:</text>
<text x="276" y="932" font-family="Arial,Helvetica,sans-serif" fill="#122744" font-size="24">The four joint probabilities depend on the angle between x and y.</text>
<text x="68" y="972" font-family="Arial,Helvetica,sans-serif" fill="#122744" font-size="25" font-weight="bold">What stays fixed:</text>
<text x="300" y="972" font-family="Arial,Helvetica,sans-serif" fill="#122744" font-size="24">Local responses use only λ₁ or λ₂, and both marginals remain ½.</text>
<text x="48" y="1034" font-family="Georgia,serif" font-size="28" font-weight="bold" fill="#122744">Figure A.3.</text>
<text x="222" y="1034" font-family="Georgia,serif" font-size="26" font-style="italic" fill="#122744">The conditional probabilities of a measurement-dependent local hidden-variable model.</text>
<text x="48" y="1072" font-family="Georgia,serif" font-size="23" fill="#122744">This construction reproduces singlet correlations for these angles, but does not explain the physical origin</text>
<text x="48" y="1101" font-family="Georgia,serif" font-size="23" fill="#122744">of measurement dependence. A single trial has one recorded outcome; columns describe ensembles.</text>
