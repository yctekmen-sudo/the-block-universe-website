<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="1120" viewBox="0 0 1672 1120" role="img" aria-labelledby="title desc">
<title id="title">Figure A.3 — An explicit measurement-dependent local hidden-variable construction</title>
<desc id="desc">Three four-state probability tables for hidden variables lambda-one and lambda-two at angles zero, ninety and one hundred eighty degrees. The individual probabilities change with the measurement settings, while each local outcome remains equally likely. Correlations are minus one, zero and plus one. This mathematical construction is not an explanation of the physical origin of setting dependence.</desc>
<rect width="1672" height="1120" fill="#ffffff"/>
<rect x="28" y="25" width="1616" height="112" rx="16" fill="#122744"/>
<text x="836" y="76" fill="white" font-size="38" font-family="Georgia,serif" font-weight="bold" text-anchor="middle">An Explicit Measurement-Dependent Model</text>
<text x="836" y="112" fill="#e4eefb" font-size="21" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">Four hidden-variable states · setting-dependent probabilities · local responses</text>
<rect x="43" y="154" width="1586" height="91" rx="12" fill="#f2f6fc" stroke="#b9cbe1"/>
<text x="65" y="191" fill="#122744" font-size="25" font-family="Arial,Helvetica,sans-serif">Local outcomes: A = λ₁     B = λ₂</text>
<text x="65" y="226" fill="#122744" font-size="25" font-family="Arial,Helvetica,sans-serif">Conditional probability: ρ(λ₁, λ₂ | x, y) = [1 − λ₁λ₂ cos θ] / 4</text>
