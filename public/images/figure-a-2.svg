<rect x="1130" y="208" width="466" height="120" rx="10" fill="#F3F7FD" stroke="#D6E2F1" stroke-width="1"/>
<text x="1150" y="241" fill="#1C65BD" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold">Quantum singlet</text>
<text x="1150" y="276" fill="#10213D" font-family="DejaVu Sans, Arial, sans-serif" font-size="27">E_QM(θ) = −cos θ</text>
<text x="1150" y="308" fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="18">Spin-½ singlet state</text>
<rect x="1130" y="347" width="466" height="183" rx="10" fill="#FFF9F1" stroke="#F0D0A5" stroke-width="1"/>
<text x="1150" y="379" fill="#D97818" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold">Example Bell-local model</text>
<text x="1150" y="410" fill="#10213D" font-family="DejaVu Sans, Arial, sans-serif" font-size="24">E_L(θ) = −1 + 2θ/π</text>
<text x="1150" y="443" fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="18">λ: uniformly distributed direction</text>
<text x="1150" y="472" fill="#10213D" font-family="DejaVu Sans, Arial, sans-serif" font-size="20">A = sgn(a·λ)</text>
<text x="1150" y="499" fill="#10213D" font-family="DejaVu Sans, Arial, sans-serif" font-size="20">B = −sgn(b·λ)</text>
<text x="1131" y="558" fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold">The example satisfies:</text>
<text x="1144" y="594" fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="18">• Local deterministic responses</text>
<text x="1144" y="625" fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="18">• Measurement independence</text>
<text x="1144" y="656" fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="18">• Perfect anti-correlation at θ = 0</text>
<rect x="1130" y="688" width="466" height="94" rx="10" fill="#F4F7FB" stroke="#DCE5F0" stroke-width="1"/>
<text x="1150" y="716" fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold">Important:</text>
<text x="1150" y="744" fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="18">This triangular curve is one local model,</text>
<text x="1150" y="769" fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="18">not the prediction of every local theory.</text>
<rect x="48" y="836" width="1576" height="122" rx="12" fill="#F3F7FB" stroke="#DCE5F0" stroke-width="1.5"/>
<text x="76" y="873" fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold">CHSH at a = 0°, a′ = 90°, b = 45°, b′ = −45°</text>
<text x="80" y="920" fill="#1C65BD" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold">Quantum  |S| = 2√2 ≈ 2.828</text>
<text x="860" y="920" fill="#D97818" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold">Local example  |S| = 2</text>
<line x1="50" y1="985" x2="1623" y2="985" stroke="#DDE6F0" stroke-width="1.5"/>
<text x="52" y="1023" fill="#10213D" font-family="Liberation Serif, Georgia, serif" font-size="25" font-weight="bold">Figure A.2.</text>
<text x="206" y="1023" fill="#10213D" font-family="Liberation Serif, Georgia, serif" font-size="24" font-style="italic">Quantum singlet correlations and one Bell-local, measurement-independent example.</text>
<text x="52" y="1063" fill="#10213D" font-family="Liberation Serif, Georgia, serif" font-size="22">(A) The singlet predicts E(θ) = −cos θ; a specified local model with a uniformly random hidden direction predicts E(θ) = −1 + 2θ/π</text>
<text x="52" y="1095" fill="#10213D" font-family="Liberation Serif, Georgia, serif" font-size="22">for 0 ≤ θ ≤ π. This comparison does not define a unique “classical” curve. (B) For the settings used in Appendix A.2, the quantum</text>
<text x="52" y="1127" fill="#10213D" font-family="Liberation Serif, Georgia, serif" font-size="22">CHSH magnitude is 2√2, while the illustrative local model reaches 2. The figure compares predictions, not mechanisms.</text>
</svg>