<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="1165" viewBox="0 0 1672 1165" role="img" aria-labelledby="figtitle figdesc">
<title id="figtitle">Figure A.2: Quantum singlet correlation and an illustrative Bell-local measurement-independent model</title>
<desc id="figdesc">Graph of correlation against relative measurement angle from zero to 180 degrees. The quantum singlet prediction is minus cosine theta, shown in blue. A specific Bell-local measurement-independent model using uniform random hidden directions and opposite sign responses predicts minus one plus two theta over pi, shown in orange. Both coincide at 0, 90 and 180 degrees; their deviations are visible at intermediate angles. A separate box lists the model and explains it is not the universal local correlation curve. For the four CHSH settings a=0, a prime=90, b=45, b prime=-45 degrees, the absolute CHSH value is two square root two for quantum and two for this local example.</desc>
<rect width="1672" height="1165" fill="#FFFFFF"/>
<text x="49" y="55" fill="#10213D" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold">Singlet correlations: quantum prediction versus a local example</text>
<text x="50" y="92" fill="#536680" font-family="Arial, Helvetica, sans-serif" font-size="20">A quantitative comparison of two specified models — not a universal curve for local hidden variables</text>
